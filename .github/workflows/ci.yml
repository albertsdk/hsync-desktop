# CI — hsync-desktop
# Lint + tests for the PySide6 GUI. hsync-desktop depends on the shared library
# through a Poetry path dependency (../hsync-common), so the sibling repo is
# checked out alongside it. PySide6 needs a few system libraries and the
# offscreen Qt platform plugin to run headless on CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout hsync-desktop
        uses: actions/checkout@v5
        with:
          path: hsync-desktop

      # Path dependency: ../hsync-common must sit next to this repo.
      # hsync-common is a private repo, so the default GITHUB_TOKEN cannot read
      # it; authenticate with a PAT stored in the HSYNC_COMMON_PAT secret.
      - name: Checkout hsync-common
        uses: actions/checkout@v5
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Gate the markdown docs on valid relative links, including the cross-repo
      # ADR pointers into the sibling hsync-common checkout. Pure stdlib script.
      - name: Docs link-check
        working-directory: hsync-desktop
        run: python ../hsync-common/scripts/dev/check_doc_links.py .

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        working-directory: hsync-desktop
        run: poetry install --no-interaction

      - name: Ruff (lint)
        working-directory: hsync-desktop
        run: poetry run ruff check .

      - name: Ruff (format check)
        working-directory: hsync-desktop
        run: poetry run ruff format --check .

      - name: Tests
        working-directory: hsync-desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest -q
