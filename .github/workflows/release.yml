name: Release

# Publish prebuilt desktop bundles (self-contained: the client engine is
# embedded), a Windows installer (Inno Setup), macOS .dmg (unsigned), a portable
# Linux x86_64 AppImage, the Debian/Ubuntu .deb packages, the RHEL-family .rpm
# packages and the install.sh installer as GitHub Release assets. There is
# intentionally no container image: hsync-desktop is a GUI application and has
# no Docker deployment mode.
#
# Two triggers:
# 1. vX.Y.Z tag pushed  →  create a formal Release.
# 2. workflow_dispatch  →  build artifacts (optionally create a Release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release (otherwise just build artifacts)"
        type: boolean
        default: false
      version_suffix:
        description: "Optional version suffix (e.g. 'dev', 'test123')"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-desktop }
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Docs link-check
        working-directory: hsync-desktop
        run: python ../hsync-common/scripts/dev/check_doc_links.py .
      - run: pipx install poetry
      - name: Install dependencies
        working-directory: hsync-desktop
        run: poetry install --no-interaction --without build
      - name: Lint
        working-directory: hsync-desktop
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
      - name: Tests
        working-directory: hsync-desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest -q

  build-binaries:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-amd64,   ext: "",     archive: tar }
          - { os: ubuntu-24.04-arm,  target: linux-arm64,   ext: "",     archive: tar }
          - { os: macos-latest,     target: darwin-arm64,  ext: "",     archive: tar }
          - { os: macos-15-intel,   target: darwin-amd64,  ext: "",     archive: tar }
          - { os: windows-latest,   target: windows-amd64, ext: ".exe", archive: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-desktop }
      # The desktop bundles the client engine into the binary, so the client
      # (and its own path dependency hsync-common) must be present and built
      # for the same platform first.
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-client
          ref: main
          path: hsync-client
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pipx install poetry
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(grep -E '^version\s*=' hsync-desktop/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            SUFFIX="${{ inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then echo "version=${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"; else echo "version=${BASE}" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Build the client engine
        working-directory: hsync-client
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with build --no-interaction
          ./compile.sh
      - name: Install dependencies
        working-directory: hsync-desktop
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with build --no-interaction
      - name: Build the desktop binary
        # Windows is built by the `windows` target below (installer + zip).
        if: matrix.target != 'windows-amd64'
        working-directory: hsync-desktop
        run: ./compile.sh
      - name: Free disk space before packaging
        # The .dmg staging and hdiutil's temp image need room on the same volume;
        # the macOS runners are tight on space and otherwise hit ENOSPC here.
        if: runner.os == 'macOS'
        run: |
          df -h /
          rm -rf "$HOME/Library/Caches/pip" "$HOME/Library/Caches/pypoetry" \
                 "$HOME/Library/Application Support/pyinstaller"
          sudo rm -rf /Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
          df -h /
      - name: Build the macOS .dmg
        # The .app embeds the (already built) per-arch client engine. macOS only:
        # PyInstaller cannot produce a .app on the other runners.
        if: runner.os == 'macOS'
        working-directory: hsync-desktop
        run: ./compile.sh --target dmg -v "${{ steps.version.outputs.version }}"
      - name: Package binary
        # Windows is packaged by the `windows` target (installer + zip).
        if: matrix.target != 'windows-amd64'
        working-directory: hsync-desktop
        run: |
          version="${{ steps.version.outputs.version }}"
          stage="hsync-desktop-${version}-${{ matrix.target }}"
          mkdir -p "release-out/${stage}"
          cp "dist/${{ matrix.target }}/hsync-desktop${{ matrix.ext }}" "release-out/${stage}/"
          # The .dmg is a standalone release asset (not embedded in the archive).
          if ls dist/macos/*.dmg >/dev/null 2>&1; then
            cp dist/macos/*.dmg "release-out/"
          fi
          cd release-out
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${stage}.zip" "${stage}"
          else
            tar czf "${stage}.tar.gz" "${stage}"
          fi
          # Only the archive is a release asset. Drop the staging dir so its raw
          # binary is not flattened into the release (it also collides between
          # architectures, which all produce a bare `hsync-desktop`).
          rm -rf "${stage}"
      - name: Build the Windows packages
        # Per-user installer (no admin) + portable zip, both produced by
        # compile.sh (Inno Setup + ImageMagick are installed just above).
        if: runner.os == 'Windows'
        working-directory: hsync-desktop
        run: |
          choco install innosetup -y --no-progress
          choco install imagemagick -y --no-progress --force
          ./compile.sh --target windows -v "${{ steps.version.outputs.version }}"
          mkdir -p release-out
          cp dist/windows/*.zip release-out/
          cp dist/windows/*-setup.exe release-out/
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: hsync-desktop/release-out/*

  build-packages:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-desktop }
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      # The self-contained .deb/.rpm bundle the client engine, built for each
      # target arch/distro inside the package container, so the client source
      # (and its hsync-common path dependency) must be present.
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-client
          ref: main
          path: hsync-client
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      # The .deb packages are cross-built for arm64 under qemu-user. The QEMU
      # that ships with the ubuntu-latest runner has regressed and makes gcc
      # crash deterministically with SIGSEGV (exit 139) while emitting -O3 code
      # for some CPython/OpenSSL translation units, aborting the source builds
      # even at -j1. Register a pinned, known-good QEMU/binfmt build instead of
      # relying on the runner default. A recent QEMU (v10.x) is required: older
      # lines (e.g. v7.0.0) avoid the gcc SIGSEGV but regress the emulated link
      # step, making CPython's libm probe fail with "requires C99 compatible
      # libm" during ./configure.
      - name: Set up QEMU (pinned, known-good)
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.1.3
          platforms: arm,arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build .deb and .rpm packages
        working-directory: hsync-desktop
        run: |
          ./compile.sh --target deb-all
          ./compile.sh --target rpm-all
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            hsync-desktop/dist/deb/*.deb
            hsync-desktop/dist/rpm/*.rpm

  build-appimage:
    needs: gate
    # Ubuntu 22.04 keeps the AppImage's glibc baseline reasonable (the AppImage
    # should run on older desktops than the runner itself).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-desktop }
      # The AppImage bundles the client engine, so the client (and its own path
      # dependency hsync-common) must be present and built for the same platform.
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-client
          ref: main
          path: hsync-client
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - name: Install Qt runtime libraries and squashfs-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 squashfs-tools
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pipx install poetry
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(grep -E '^version\s*=' hsync-desktop/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            SUFFIX="${{ inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then echo "version=${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"; else echo "version=${BASE}" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Build the client engine
        working-directory: hsync-client
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with build --no-interaction
          ./compile.sh
      - name: Build the desktop AppImage
        working-directory: hsync-desktop
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with build --no-interaction
          ./compile.sh --target appimage -v "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: hsync-desktop/dist/appimage/*.AppImage

  release:
    needs: [build-binaries, build-packages, build-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-desktop }
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(grep -E '^version\s*=' hsync-desktop/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            SUFFIX="${{ inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then echo "tag=v${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"; else echo "tag=v${BASE}" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Flatten assets
        run: |
          cd assets
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
      - name: Create latest aliases
        # Fixed-name copies so `releases/latest/download/<name>` is a stable link.
        # A missing source is skipped (that format was not built in this run).
        run: |
          cd assets
          mk_alias() {
            for spec in "$@"; do
              src="${spec%%|*}"
              dst="${spec##*|}"
              # shellcheck disable=SC2086
              if ls $src >/dev/null 2>&1; then cp $src "$dst"; fi
            done
          }
          mk_alias \
            "hsync-desktop-*-linux-amd64.tar.gz|hsync-desktop-linux-amd64.tar.gz" \
            "hsync-desktop-*-linux-arm64.tar.gz|hsync-desktop-linux-arm64.tar.gz" \
            "hsync-desktop-*-darwin-arm64.tar.gz|hsync-desktop-darwin-arm64.tar.gz" \
            "hsync-desktop-*-darwin-amd64.tar.gz|hsync-desktop-darwin-amd64.tar.gz" \
            "hsync-desktop-*-windows-amd64.zip|hsync-desktop-windows-amd64.zip" \
            "hsync-desktop_*_amd64.deb|hsync-desktop-amd64.deb" \
            "hsync-desktop_*_arm64.deb|hsync-desktop-arm64.deb" \
            "hsync-desktop-*-1.el9.x86_64.rpm|hsync-desktop-x86_64.rpm" \
            "hsync-desktop-*-1.el9.aarch64.rpm|hsync-desktop-aarch64.rpm" \
            "hsync-desktop-*-x86_64.AppImage|hsync-desktop-x86_64.AppImage" \
            "hsync-desktop-*-darwin-arm64.dmg|hsync-desktop-darwin-arm64.dmg" \
            "hsync-desktop-*-darwin-amd64.dmg|hsync-desktop-darwin-amd64.dmg" \
            "hsync-desktop-*-windows-amd64-setup.exe|hsync-desktop-windows-amd64-setup.exe"
      - name: Prepare installer
        run: |
          sed "s/^readonly DEFAULT_VERSION=.*/readonly DEFAULT_VERSION=\"${{ steps.tag.outputs.tag }}\"/" \
            hsync-desktop/install.sh > "assets/install.sh"
          chmod 755 "assets/install.sh"
      - name: Generate checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' || inputs.create_release
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          make_latest: ${{ ! contains(steps.tag.outputs.tag, '-') }}
