[project]
name = "hsync-desktop"
version = "1.2.0-alpha.1"
description = "HSYNC Desktop - Cross-platform GUI for HSYNC Client"
authors = [{name = "Alberto Basso", email = "17047798+albertsdk@users.noreply.github.com"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cryptography>=50.0.2,<51.0.0",
    "hsync-common==1.2.0-alpha.1",
    "PySide6>=6.11.2,<7.0.0",
]
keywords = ["sync", "file-sync", "gui", "desktop", "qt", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: Desktop Environment",
]

[project.urls]
Repository = "https://github.com/albertsdk/hsync"

[project.scripts]
hsync-desktop = "hsync_desktop.main:main"

[tool.poetry]
packages = [{include = "hsync_desktop"}]
include = [
    "hsync_desktop/resources/**/*",
    "hsync_desktop/ui/*.ui",
]

[tool.poetry.dependencies]
hsync-common = {path = "../hsync-common", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-qt = "^4.5.0"
ruff = "0.17.5"
mypy = "^2.3.1"
pre-commit = "^4.6.2"
pytest-cov = "^7.1.0"


[tool.poetry.group.build.dependencies]
pyinstaller = "^6.22.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"
filterwarnings = [
    "error::DeprecationWarning:hsync_desktop.*",
    "error::DeprecationWarning:tests.*",
    "default::Warning:hsync_desktop.*",
    "default::Warning:tests.*",
    "ignore::DeprecationWarning:pathspec.*",
]

[tool.coverage.run]
omit = [
    "*/shibokensupport/*",
    "*/signature_rendezvous.py",
    "*/.venv/*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Curated best-practice set shared across the hsync Python projects (see
# hsync-common/pyproject.toml for the rationale).
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B", "A", "C4",
    "ISC", "ICN",
    "PIE", "RET", "RSE",
    "SIM", "TID",
    "ARG", "PERF",
    "FURB", "RUF",
    "PGH", "LOG", "G",
    "PL", "T10", "ERA",
    "C90",
]
ignore = [
    # pre-existing
    "E501", "E402", "B904", "B008", "B017",
    "SIM115", "SIM117", "SIM102", "SIM105", "SIM101", "SIM103", "SIM108", "SIM118",
    # deliberate patterns / opinionated rules
    "ARG002", "EM101", "EM102", "TRY003", "N818",
    "PLC0415", "PLW0603", "PLR2004",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    "PTH", "DTZ005", "ERA001", "RUF002", "RUF003",
    # desktop-specific: Qt overrides / import conventions, UI typography, and the
    # Qt-signal / mock lambdas that ignore their arguments.
    "N802", "N811", "N812", "N813",
    "RUF001", "ARG005", "A001",
]

[tool.ruff.lint.per-file-ignores]
# Tests keep fixture parameters, unpacked shapes, loose lambdas and odd strings.
"tests/**" = [
    "ARG001", "ARG004", "RUF059", "RUF012", "RUF007", "RUF015", "RUF005",
    "RUF010", "RUF046", "PLR0402", "PLW0108", "PLW1510", "PLW2901", "PERF102",
    "RET501", "RET504", "PLR1711", "PIE807", "PIE808", "FURB171", "ICN001",
    "RSE102", "PERF401",
]
"bench/**" = ["ARG001", "ARG005", "RUF059", "PIE810", "PLW1510"]

[tool.ruff.lint.mccabe]
# A pragmatic ceiling that the current code meets; lower it as functions are
# refactored.
max-complexity = 15

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
