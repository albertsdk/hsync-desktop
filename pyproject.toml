[tool.poetry]
name = "hsync-desktop"
version = "1.0.0"
description = "HSYNC Desktop - Cross-platform GUI for HSYNC Client"
authors = ["Alberto Basso"]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/albertobasso/hsync"
keywords = ["sync", "file-sync", "gui", "desktop", "qt", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: Desktop Environment",
]
packages = [{include = "hsync_desktop"}]
include = [
    "hsync_desktop/resources/**/*",
    "hsync_desktop/ui/*.ui",
]

[tool.poetry.scripts]
hsync-desktop = "hsync_desktop.main:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
PySide6 = "^6.11.0"
cryptography = "^46.0.4"

[tool.poetry.group.build.dependencies]
pyinstaller = "^6.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-qt = "^4.4.0"
ruff = "^0.9.0"
mypy = "^1.14.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "B008", "B017", "F401", "SIM101", "SIM103", "SIM105", "SIM118", "F841", "SIM102", "SIM108"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
