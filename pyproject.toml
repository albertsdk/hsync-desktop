[project]
name = "hsync-desktop"
version = "1.0.12"
description = "HSYNC Desktop - Cross-platform GUI for HSYNC Client"
authors = [{name = "Alberto Basso", email = "17047798+albertsdk@users.noreply.github.com"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cryptography>=50.0.2,<51.0.0",
    "hsync-common==1.0.12",
    "PySide6>=6.11.2,<7.0.0",
]
keywords = ["sync", "file-sync", "gui", "desktop", "qt", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: Desktop Environment",
]

[project.urls]
Repository = "https://github.com/albertsdk/hsync"

[project.scripts]
hsync-desktop = "hsync_desktop.main:main"

[tool.poetry]
packages = [{include = "hsync_desktop"}]
include = [
    "hsync_desktop/resources/**/*",
    "hsync_desktop/ui/*.ui",
]

[tool.poetry.dependencies]
hsync-common = {path = "../hsync-common", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-qt = "^4.5.0"
ruff = "0.17.3"
mypy = "^2.3.1"
pre-commit = "^4.6.2"
pytest-cov = "^7.1.0"


[tool.poetry.group.build.dependencies]
pyinstaller = "^6.22.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"
filterwarnings = [
    "error::DeprecationWarning:hsync_desktop.*",
    "error::DeprecationWarning:tests.*",
    "default::Warning:hsync_desktop.*",
    "default::Warning:tests.*",
    "ignore::DeprecationWarning:pathspec.*",
]

[tool.coverage.run]
omit = [
    "*/shibokensupport/*",
    "*/signature_rendezvous.py",
    "*/.venv/*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "B008", "B017", "F401", "SIM101", "SIM103", "SIM105", "SIM118", "F841", "SIM102", "SIM108"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
